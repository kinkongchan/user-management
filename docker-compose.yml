services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: usermgmt
      POSTGRES_PASSWORD: usermgmt
      POSTGRES_DB: usermgmt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usermgmt -d usermgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
